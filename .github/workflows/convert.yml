name: Convert RealESRGAN to TFLite

on:
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

jobs:
  convert:
    runs-on: ubuntu-22.04  # Dùng Ubuntu 22.04 để tương thích tốt hơn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Tăng swap tránh lỗi OOM (GitHub Actions free RAM ~7GB)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cài đặt thư viện (CPU-only để nhẹ & nhanh)
        run: |
          pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          pip install onnx==1.15.0 onnx2tf==1.17.0 tensorflow==2.15.0 numpy==1.24.3

      - name: Chạy script convert
        run: python convert.py

      - name: Upload file TFLite
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN_x2plus-tflite
          path: RealESRGAN_x2plus.tflite
          retention-days: 30
          compression-level: 0  # Không nén để tải nhanh hơn
