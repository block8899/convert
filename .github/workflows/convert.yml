name: Convert RealESRGAN to TFLite + NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Setup Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true; sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile; sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile; free -h

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir basicsr==1.4.2
          pip install --no-cache-dir psutil h5py flatbuffers onnx==1.15.0 onnxsim onnx_graphsurgeon sng4onnx onnx2tf==1.16.0 tensorflow==2.15.0 numpy==1.23.5 "protobuf>=3.20.3,<5"

      - name: Install NCNN Tools
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu.zip || \
          wget -q https://github.com/Tencent/ncnn/releases/download/20230816/ncnn-20230816-ubuntu.zip || \
          wget -q https://github.com/Tencent/ncnn/releases/download/20230727/ncnn-20230727-ubuntu.zip
          ls -la ncnn-*.zip 2>/dev/null
          unzip -o ncnn-*.zip
          ls -la ncnn-*/bin/
          sudo cp ncnn-*/bin/onnx2ncnn /usr/local/bin/ || echo "onnx2ncnn not found in bin"
          sudo chmod +x /usr/local/bin/onnx2ncnn 2>/dev/null || true
          onnx2ncnn 2>/dev/null && echo "onnx2ncnn installed OK" || echo "onnx2ncnn not available"

      - name: Run Conversion
        run: python convert.py

      - name: Upload TFLite + NCNN Files
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-Models
          path: |
            *.tflite
            *.param
            *.bin
          retention-days: 30
