name: Convert RealESRGAN to TFLite

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Setup Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true; sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile; sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile; free -h

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          pip install --no-cache-dir psutil h5py flatbuffers onnx==1.15.0 onnxsim onnx_graphsurgeon sng4onnx onnx2tf==1.16.0 tensorflow==2.15.0 numpy==1.23.5 "protobuf>=3.20.3,<5"

      - name: Run Conversion
        run: python convert.py

      - name: Upload TFLite Files
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-TFLite
          path: "*.tflite"          # ✅ Tự động bắt mọi file .tflite trong thư mục
          retention-days: 30
