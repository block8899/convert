name: Convert RealESRGAN to TFLite + NCNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Setup Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true; sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile; sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile; free -h

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir basicsr==1.4.2
          pip install --no-cache-dir psutil h5py flatbuffers onnx==1.15.0 onnxsim onnx_graphsurgeon sng4onnx onnx2tf==1.16.0 tensorflow==2.15.0 numpy==1.23.5 "protobuf>=3.20.3,<5"

      - name: Install NCNN Tools
        run: |
          sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
          pip install onnx
          git clone --depth=1 https://github.com/Tencent/ncnn.git ncnn-src
          cd ncnn-src/tools/onnx
          # Tìm onnx.proto3 ở bất kỳ đâu
          PROTO_PATH=$(find / -name "onnx.proto3" -type f 2>/dev/null | head -1)
          if [ -n "$PROTO_PATH" ]; then
            cp "$PROTO_PATH" onnx.proto3
          else
            wget -q https://raw.githubusercontent.com/onnx/onnx/main/onnx/onnx.proto3
          fi
          protoc --cpp_out=. onnx.proto3
          cd ../../..
          cd ncnn-src
          mkdir build && cd build
          cmake -DNCNN_BUILD_TOOLS=ON -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_VULKAN=OFF -DNCNN_BUILD_BENCHMARK=OFF ..
          make -j$(nproc)
          if [ -f tools/onnx/onnx2ncnn ]; then
            sudo cp tools/onnx/onnx2ncnn /usr/local/bin/
            onnx2ncnn 2>&1 | head -3
          else
            echo "FAIL: onnx2ncnn not built"
            ls tools/onnx/
            exit 1
          fi

      - name: Run Conversion
        run: python convert.py

      - name: Upload TFLite + NCNN Files
        uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-Models
          path: |
            *.tflite
            *.param
            *.bin
          retention-days: 30
